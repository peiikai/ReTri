<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1519"/>
      <stop offset="0.5" stop-color="#4a3036"/>
      <stop offset="0.85" stop-color="#94573a"/>
      <stop offset="1" stop-color="#b8703c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0c27a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8a85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="riftedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a85a"/>
      <stop offset="1" stop-color="#d07aa8"/>
    </linearGradient>
    <radialGradient id="riftin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#05030a"/>
      <stop offset="0.7" stop-color="#1a0c22"/>
      <stop offset="1" stop-color="#5a2a58"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3438"/>
      <stop offset="1" stop-color="#2b2026"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.45" stop-color="#c08a52"/>
      <stop offset="1" stop-color="#5e3a22"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="1" stop-color="#a86a2a"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fffbf2"/>
      <stop offset="0.45" stop-color="#f8dca4"/>
      <stop offset="1" stop-color="#e8a85a"/>
    </radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#f0e8dc">
      <circle cx="180" cy="420" r="4"/><circle cx="260" cy="500" r="3"/><circle cx="820" cy="170" r="4"/>
      <circle cx="880" cy="250" r="3"/><circle cx="560" cy="170" r="3"/><circle cx="160" cy="560" r="3"/>
    </g>
    <!-- the glow of the staff's orb, echoes rippling out of it -->
    <circle cx="620" cy="420" r="330" fill="url(#glow)"/>
    <g fill="none" stroke="#f0d890">
      <circle cx="620" cy="420" r="110" stroke-width="6" opacity="0.5"/>
      <circle cx="620" cy="420" r="185" stroke-width="5" opacity="0.34"/>
      <circle cx="620" cy="420" r="265" stroke-width="4" opacity="0.2"/>
      <circle cx="620" cy="420" r="350" stroke-width="3" opacity="0.1"/>
    </g>
    <!-- the rift: a tear in the sky, glowing at the edges -->
    <path d="M60 180 L150 214 L176 196 L196 232 L250 226 L262 204 L298 258 L344 250 L356 230 L384 282 L430 288 L446 270 L470 306 L536 334 L466 346 L452 368 L414 352 L370 378 L352 356 L310 364 L282 344 L250 372 L232 336 L188 330 L170 304 L126 300 Z"
          fill="url(#riftin)" stroke="url(#riftedge)" stroke-width="10" stroke-linejoin="round"/>
    <g fill="#1a0c22" stroke="#d07aa8" stroke-width="4" stroke-linejoin="round">
      <path d="M262 420 L290 404 L300 432 Z"/>
      <path d="M380 410 L398 402 L404 420 Z"/>
      <path d="M196 382 L214 376 L212 394 Z"/>
    </g>
    <!-- hills at dusk -->
    <path d="M100 690 Q260 610 440 650 Q640 700 924 600 L924 924 L100 924 Z" fill="url(#hill)"/>
    <path d="M100 800 Q330 730 600 770 Q790 800 924 740 L924 924 L100 924 Z" fill="#2b2026"/>
    <!-- the staff, planted in the hill -->
    <g transform="translate(620 420) rotate(-6)">
      <path d="M-20 44 L20 44 L16 430 L-16 430 Z" fill="url(#wood)" stroke="#3a2618" stroke-width="5"/>
      <rect x="-27" y="150" width="54" height="28" rx="8" fill="url(#bronze)" stroke="#5a3616" stroke-width="4"/>
      <rect x="-25" y="196" width="50" height="16" rx="6" fill="url(#bronze)" stroke="#5a3616" stroke-width="4"/>
      <path d="M-78 -22 Q-84 56 0 70 Q84 56 78 -22 Q66 36 0 44 Q-66 36 -78 -22 Z" fill="url(#bronze)" stroke="#5a3616" stroke-width="5"/>
      <circle cx="0" cy="0" r="52" fill="url(#orb)" stroke="#a86a2a" stroke-width="4"/>
      <circle cx="-16" cy="-18" r="13" fill="#ffffff" opacity="0.85"/>
    </g>
    <path d="M520 862 Q600 838 700 858" stroke="#1f181a" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
</svg>
