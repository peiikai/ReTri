# Nightly builds (from LAS Recomp's nightly.yml): every platform from develop, on one rolling pre-release, "nightly"
# (releases/tag/nightly, which the README links). All on GitHub's own runners.
#
# Rounds: a new round starts if develop moved since the last one: version nightly-<YYYYMMDDHHMM>-<commit>,
# LARECOMP_NIGHTLY_STAMP = that time (tools/nightly_version.sh), so a nightly's update check only offers a newer nightly
# of its own platform (runtime/ui/update_tags.h, newest_nightly). Each platform's job puts its own file up as soon as it
# is built (tools/nightly_publish.sh), so a slow or failed platform never holds the others back.
# Catch-up: a run with new_round=false builds the current round's missing platforms again (a failed job), from the
# same commit with the same version.
# The round (its stamp and commit) is kept in the release's notes, as a "nightly-round:" line.
#
# Schedule (on since the repository went public; its Actions minutes are free): a new round at 10:00 UTC if develop
# moved, a catch-up every 3 hours. GitHub runs scheduled triggers from the default branch's (main's) copy of this file.
# GitHub drops scheduled triggers at times: if the 10:00 one never ran, the first catch-up after it starts the round.
#
# By hand: gh workflow run nightly.yml [-f new_round=false] [-f ref=<branch>]
#   ref: what a new round builds (default develop). A branch's round still goes on the one nightly page.
name: Nightly
on:
  schedule:
    - cron: '0 10 * * *'   # a new round, if develop moved
    - cron: '0 */3 * * *'  # catch-up for the current round
  workflow_dispatch:
    inputs:
      new_round:
        description: 'Start a new round if the branch moved (false: only catch up the current one)'
        type: boolean
        default: true
      ref:
        description: 'Branch a new round builds'
        type: string
        default: develop
permissions:
  contents: read
concurrency:  # (one run at a time: a catch-up never races a new round)
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'peiikai/ReTri'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # (the rolling release: its notes, its tag)
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      stamp: ${{ steps.p.outputs.stamp }}
      version: ${{ steps.p.outputs.version }}
      macos: ${{ steps.p.outputs.macos }}
      ios: ${{ steps.p.outputs.ios }}
      windows: ${{ steps.p.outputs.windows }}
      windows_arm64: ${{ steps.p.outputs.windows_arm64 }}
      android: ${{ steps.p.outputs.android }}
      linux: ${{ steps.p.outputs.linux }}
    steps:
      - name: Round and missing platforms
        id: p
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          NEW_ROUND: ${{ inputs.new_round }}
          REF: ${{ inputs.ref || 'develop' }}
        run: |
          [[ $REF =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref '$REF': a branch name"; exit 1; }
          DEV=$(gh api "repos/$GH_REPO/commits/$REF" -q .sha)
          BODY=$(gh release view nightly --json body -q .body 2>/dev/null || true)
          ROUND=$(grep -o 'nightly-round: [0-9]\{12\} [0-9a-f]\{40\}' <<< "$BODY" | head -1 || true)
          RSTAMP=$(awk '{print $2}' <<< "$ROUND"); RSHA=$(awk '{print $3}' <<< "$ROUND")
          NEW=false
          if [ "$SCHEDULE" = '0 10 * * *' ] || { [ "$EVENT" = workflow_dispatch ] && [ "$NEW_ROUND" = true ]; }; then
            [ "$DEV" != "$RSHA" ] && NEW=true
          fi
          # GitHub sometimes drops a scheduled trigger: if today's 10:00 one never started a round, the first
          # catch-up after 10:00 UTC starts it instead.
          SLOT=$(date -u +%Y%m%d)1000
          if [ "$EVENT" = schedule ] && [ "$(date -u +%Y%m%d%H%M)" -ge "$SLOT" ] && [ "${RSTAMP:-0}" -lt "$SLOT" ]; then
            [ "$DEV" != "$RSHA" ] && NEW=true
          fi
          [ -z "$RSHA" ] && NEW=true  # (the first round)
          if [ "$NEW" = true ]; then STAMP=$(date -u +%Y%m%d%H%M); SHA=$DEV; else STAMP=$RSTAMP; SHA=$RSHA; fi
          VERSION=nightly-$STAMP-${SHA::7}
          if [ "$NEW" = true ]; then
            URL=https://github.com/$GH_REPO
            {
              echo "> [!WARNING]"
              echo "> **These are nightly builds of the next version, made from the \`develop\` branch.** They have the newest changes and can be broken on any given day. For normal play, use the **[latest release]($URL/releases/latest)**."
              echo
              echo "Built from [\`${SHA::7}\`]($URL/commit/$SHA) on $(date -u -d "${STAMP::8} ${STAMP:8:2}:${STAMP:10:2}" '+%Y-%m-%d %H:%M UTC'). Each platform's file appears as soon as it is built, and the start screen tells you when a newer nightly is here. A nightly only offers newer nightlies, never a release."
              echo
              echo "- macOS: \`macOS.dmg\`"
              echo "- Windows: \`windows-x64.zip\`; Windows on ARM: \`windows-arm64.zip\`"
              echo "- Linux: \`linux-x64.AppImage\`, \`linux-arm64.AppImage\`; the same as a folder (no FUSE needed): \`linux-x64.tar.gz\`, \`linux-arm64.tar.gz\`"
              echo "- Android: \`android.apk\`"
              echo "- iPhone and iPad: \`iOS.laskit\`, made into the app with a nightly desktop build of the same date"
              # Changes: the pull requests merged since the previous round, newest round first, with the earlier
              # rounds' lists kept, so a player several nightlies behind sees everything in the start screen's update
              # dialog. Each round starts with a "nightly-changes: <stamp>" line; the dialog shows the rounds newer
              # than its own build (runtime/ui/update_notes.h).
              # Kept: the rounds since the newest feature release (vX.Y.0; patch releases only carry fixes, so they
              # wipe nothing), at most 90 so the notes stay under GitHub's size limit.
              # Left out: release-line forward merges ("Merge release/x into develop"); the pull requests they carry
              # are listed on their own.
              CHANGES=
              if [ -n "$RSHA" ]; then
                CHANGES=$(gh api "repos/$GH_REPO/compare/$RSHA...$SHA" --jq '.commits[] | select(.parents | length > 1) | .commit.message | capture("^Merge pull request #(?<n>[0-9]+)[^\n]*\n\n(?<t>[^\n]+)") | select(.t | startswith("Merge release/") | not) | "- \(.t) (#\(.n))"' 2>/dev/null | tac || true)
              fi
              FEAT=$(gh api "repos/$GH_REPO/releases?per_page=30" --jq '[.[] | select((.prerelease or .draft) | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.0$"))][0].published_at // empty' 2>/dev/null || true)
              CUT=0; [ -n "$FEAT" ] && CUT=$(date -u -d "$FEAT" +%Y%m%d%H%M)
              OLD=$(awk -v cut="$CUT" '/^<!-- nightly-changes: [0-9][0-9]* -->$/ { n++; keep = ($3 + 0 > cut + 0 && n < 90) } keep && !/^To report a problem/' <<< "$BODY" | sed -e '/^<!-- nightly-round:/,$d' -e '/^- Merge release\//d')
              if [ -n "$CHANGES" ] || [ -n "$OLD" ]; then
                echo; echo "## Changes"; echo
                if [ -n "$CHANGES" ]; then
                  echo "<!-- nightly-changes: $STAMP -->"
                  echo "**$(date -u -d "${STAMP::8}" '+%Y-%m-%d')**"; echo
                  echo "$CHANGES"; echo
                fi
                [ -n "$OLD" ] && echo "$OLD"
              fi
              echo
              echo "To report a problem, open an [issue]($URL/issues), say it's a nightly and which date, and attach the log (\`eowrecomp.log\` in the data folder)."
              echo
              echo "<!-- nightly-round: $STAMP $SHA -->"
            } > notes.md
            if gh release view nightly >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true > /dev/null
              gh release edit nightly --notes-file notes.md --title "Nightly builds"
            else
              gh release create nightly --prerelease --latest=false --title "Nightly builds" --notes-file notes.md --target "$SHA"
            fi
          fi
          ASSETS=$(gh release view nightly --json assets -q '.assets[].name' 2>/dev/null || true)
          missing() { grep -qx "ReTri-$VERSION-$1" <<< "$ASSETS" && echo false || echo true; }
          LINUX=()
          [ "$(missing linux-x64.AppImage)" = true ] || [ "$(missing linux-x64.tar.gz)" = true ] && LINUX+=('{"arch":"x86_64","name":"x64","runner":"ubuntu-24.04"}')
          [ "$(missing linux-arm64.AppImage)" = true ] || [ "$(missing linux-arm64.tar.gz)" = true ] && LINUX+=('{"arch":"aarch64","name":"arm64","runner":"ubuntu-24.04-arm"}')
          LJSON="[$(IFS=,; echo "${LINUX[*]}")]"
          {
            echo "sha=$SHA"; echo "stamp=$STAMP"; echo "version=$VERSION"
            echo "macos=$(missing macOS.dmg)"; echo "ios=$(missing iOS.laskit)"
            echo "windows=$(missing windows-x64.zip)"; echo "windows_arm64=$(missing windows-arm64.zip)"
            echo "android=$(missing android.apk)"; echo "linux=$LJSON"
          } >> "$GITHUB_OUTPUT"
          echo "round $VERSION ($([ "$NEW" = true ] && echo new || echo catch-up)); $REF $DEV"
          cat "$GITHUB_OUTPUT"

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - name: Packages
        run: brew install ninja
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps
            !build/deps/src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_deps_macos.sh') }}
      - name: Deps (SDL3, LGPL FFmpeg)
        run: make deps
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps
            !build/deps/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      - name: App and disk image
        run: make -j"$(sysctl -n hw.ncpu)" dmg
      - name: No game files or game code
        run: tools/check_no_game_files.sh build/dist/*-macOS.dmg
      - name: Sparkle feed
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}' }
        run: tools/sparkle_appcast.sh nightly build/dist/*-macOS.dmg
      # (the plan job has written this round's notes: their "## Changes" go into the feed, so Sparkle's window shows
      # them; tools/sparkle_notes.sh. Never fatal: on a failure the feed keeps the release page link, and the .dmg
      # still goes up.)
      - name: Notes in the Sparkle feed
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          [ -f build/dist/appcast-macOS.xml ] || exit 0
          if ! { gh release view nightly --json body -q .body > build/nightly-body.md &&
                 tools/sparkle_notes.sh build/dist/appcast-macOS.xml nightly build/nightly-body.md; }; then
            echo "::warning::release notes not added to appcast-macOS.xml: it keeps the release page link"
          fi
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: tools/nightly_publish.sh build/dist/*-macOS.dmg macOS.dmg

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - name: Packages
        run: brew install ninja
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/deps-ios
          key: deps-ios-${{ hashFiles('tools/build_deps_ios.sh', 'tools/patches/SDL3-3.4.18-ios27-orientation.patch') }}
      - name: Deps (SDL3, FFmpeg)
        run: make deps-ios
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: build/deps-ios
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Toolchain cache (the zig archive, the five lld archives)
        uses: actions/cache@v4
        with:
          path: |
            build/zig-dl
            build/lld-dl
          key: ios-kit-tools-${{ hashFiles('tools/fetch_zig.sh', 'tools/fetch_lld.sh') }}
      - name: Linkers for every desktop, the compiler's headers
        run: |
          tools/fetch_zig.sh
          for t in aarch64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do LLD_TARGET=$t tools/fetch_lld.sh; done
      - name: Kit
        run: make -j"$(sysctl -n hw.ncpu)" ios-kit
      # (the whole kit: the app under Payload/ and every desktop's linker; LASGame.framework holds only its Info.plist:
      # the game library is never in it - the player's desktop builds and adds it)
      - name: No game files or game code
        run: |
          K=$(ls build/dist/*-iOS.laskit)
          ! zipinfo -1 "$K" | grep -qE '^Payload/ReTri.app/Frameworks/LASGame.framework/LASGame(\.id)?$' || { echo "::error::game library in the kit"; exit 1; }
          tools/check_no_game_files.sh "$K"
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: tools/nightly_publish.sh build/dist/*-iOS.laskit iOS.laskit

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p binutils:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p nasm:p
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-${{ runner.os }}-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      - name: Zip
        run: make -j"$(nproc)" dist
      - name: No game files or game code
        run: tools/check_no_game_files.sh build/dist/*-windows-x64.zip
      - name: Update manifest
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}', VERSION: '${{ needs.plan.outputs.version }}' }
        run: tools/update_manifest.sh "$VERSION" windows-x64 build/dist/*-windows-x64.zip build/dist/ReTri
      - name: Publish
        shell: bash  # (Git Bash: gh is on its PATH, not MSYS2's)
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: tools/nightly_publish.sh build/dist/*-windows-x64.zip windows-x64.zip

  windows-arm64:
    needs: plan
    if: needs.plan.outputs.windows_arm64 == 'true'
    runs-on: windows-11-arm
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p vulkan-memory-allocator:p
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-windows-arm64-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      - name: Zip
        run: make -j"$(nproc)" dist
      - name: No game files or game code
        run: tools/check_no_game_files.sh build/dist/*-windows-arm64.zip
      - name: Update manifest
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}', VERSION: '${{ needs.plan.outputs.version }}' }
        run: tools/update_manifest.sh "$VERSION" windows-arm64 build/dist/*-windows-arm64.zip build/dist/ReTri
      - name: Publish
        shell: bash  # (Git Bash: gh is on its PATH, not MSYS2's)
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: tools/nightly_publish.sh build/dist/*-windows-arm64.zip windows-arm64.zip

  # Each arch on a runner of its own arch: tools/linux/appimage.sh builds everything natively in one container.
  linux:
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/linux/${{ matrix.arch }}/deps
          key: deps-linux-${{ matrix.arch }}-${{ hashFiles('tools/linux/build_deps.sh', 'tools/linux/Containerfile') }}
      - name: AppImage
        run: make appimage ARCH=${{ matrix.arch }}
      - uses: actions/cache/save@v4
        if: always() && steps.deps.outputs.cache-hit != 'true' && hashFiles(format('build/linux/{0}/deps/lib/libshaderc_shared.so*', matrix.arch)) != ''
        with:
          path: build/linux/${{ matrix.arch }}/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Tarball
        run: make tarball ARCH=${{ matrix.arch }}
      - name: No game files or game code
        run: tools/check_no_game_files.sh build/dist/*-linux-${{ matrix.name }}.AppImage build/dist/*-linux-${{ matrix.name }}.tar.gz
      - name: Data folder rules
        run: tools/linux/check_portable.sh ${{ matrix.arch }}
      - name: Update manifest
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}', VERSION: '${{ needs.plan.outputs.version }}' }
        run: tools/update_manifest.sh "$VERSION" linux-${{ matrix.name }} build/dist/*-linux-${{ matrix.name }}.AppImage
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          tools/nightly_publish.sh build/dist/*-linux-${{ matrix.name }}.AppImage linux-${{ matrix.name }}.AppImage
          tools/nightly_publish.sh build/dist/*-linux-${{ matrix.name }}.tar.gz linux-${{ matrix.name }}.tar.gz -

  # Signed with the published APKs' key (docs/android.md: repository secrets ANDROID_KEYSTORE_B64 and
  # ANDROID_KEYSTORE_PASSWORD, alias retri), so each nightly installs over the last. Without the secrets the APK
  # is built and checked but not put up (an unsigned APK doesn't install).
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Nightly version
        env: { VERSION: '${{ needs.plan.outputs.version }}', STAMP: '${{ needs.plan.outputs.stamp }}' }
        run: tools/nightly_version.sh "$VERSION" "$STAMP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.30.4" "platforms;android-36" > /dev/null
      - name: Dependencies cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: android/deps/out
          key: android-deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/build_gen_deps.sh') }}
      - name: Dependencies (SDL3, shaderc, FFmpeg, volk, Vulkan headers; the game code builder)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          bash android/deps/build_deps.sh
          bash android/deps/build_gen_deps.sh
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: android/deps/out
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: APK
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          LARECOMP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LARECOMP_VERSION_NAME: ${{ needs.plan.outputs.version }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$LARECOMP_KEYSTORE_PASSWORD" ]; then
            export LARECOMP_KEYSTORE=$RUNNER_TEMP/retri.keystore
            echo "$KEYSTORE_B64" | base64 -d > "$LARECOMP_KEYSTORE"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set: the APK is built unsigned and not published"
          fi
          # (Android's version code only grows: minutes since 2026-01-01)
          export LARECOMP_VERSION_CODE=$(( ($(date -u +%s) - $(date -u -d 20260101 +%s)) / 60 ))
          (cd android && ./gradlew assembleRelease --console=plain)
          rm -f "$RUNNER_TEMP/retri.keystore"
      - name: No game files (and signed)
        env: { VERSION: '${{ needs.plan.outputs.version }}', SIGNED: '${{ steps.apk.outputs.signed }}' }
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ "$SIGNED" != true ] || "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          tools/check_no_game_files.sh "$APK"
          mkdir -p build/dist && cp "$APK" "build/dist/ReTri-$VERSION-android.apk"
      - name: Publish
        if: steps.apk.outputs.signed == 'true'
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
